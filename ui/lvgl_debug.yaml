              - label:
                  text: "Forget Wi-Fi"
                  align: CENTER
            on_click:
              - logger.log: "Forget Wi-Fi: erasing the stored network and rebooting into Improv"
              - lambda: |-
                  // The network stored by Improv lives in the "esphome" NVS
                  // namespace (Wi-Fi settings + fast-connect keys).
                  nvs_handle_t h;
                  if (nvs_open("esphome", NVS_READWRITE, &h) == ESP_OK) {
                    nvs_erase_key(h, "88491487");
                    nvs_erase_key(h, "88491488");
                    nvs_commit(h);
                    nvs_close(h);
                  }
                  App.safe_reboot();

