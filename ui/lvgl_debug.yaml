interval:
  # Buttons: activity timestamp, swallow the wake-up press.
  - interval: 20ms
    then:
      - lambda: |-
          bool any = id(${key_left}).state || id(${key_right}).state;
          static bool first = true;
          if (first) {
            first = false;
            id(wl_ui_apply_rotation).execute();
            // Woken by a button press: ignore it until it is released.
            id(wl_ui_swallow) = any;
          }
          if (any)
            id(wl_ui_last_act) = millis();
          else
            id(wl_ui_swallow) = false;

  # LEDs follow the light (fast enough for pulse / strobe effects).
  - interval: 50ms
    then:
      - script.execute: wl_ui_led

  - interval: 1s
    then:
      # Deep sleep (screen off) after inactivity, unless set to "never".
      - if:
          condition:
            lambda: |-
              static const uint32_t SLEEP_S[4] = {30, 60, 180, 300};
              uint8_t i = id(wl_ui_sleep_idx);
              return i < 4 && millis() - id(wl_ui_last_act) >= SLEEP_S[i] * 1000u;
          then:
            - logger.log: "No button pressed for the sleep timeout - entering deep sleep"
            - light.turn_off: ${backlight_id}
            - deep_sleep.enter: ${deep_sleep_id}
      - script.execute: wl_ui_refresh
